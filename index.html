<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men� Principal - Gerencia</title>
  <style>
    :root {
      --bg-app: #f3f5f8;
      --surface: #ffffff;
      --text-main: #0f172a;
      --primary: #0f172a;
      --accent: #2563eb;
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius-lg: 18px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 40px;
      width: 90%;
      max-width: 600px;
    }
    h1 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.1;
      color: var(--primary);
    }
    .menu-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr;
    }
    .btn-nav {
      background: var(--surface);
      border: 1px solid rgba(0,0,0,0.1);
      padding: 24px;
      border-radius: var(--radius-lg);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }
    .btn-nav:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      color: var(--accent);
    }
    @media (min-width: 600px) {
      .menu-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>DASHBOARD PARA GERENCIA</h1>
    
    <div class="menu-grid">
      <a href="solicitudes.html" class="btn-nav">Solicitudes</a>
      <a href="dashboard_gerencia.html" class="btn-nav">Gerencia</a>
    </div>
  </div>

</body>
</html>
